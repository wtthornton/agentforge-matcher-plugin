[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentforge-matcher-plugin"
version = "1.0.0"
description = "Test rig for AgentForge hybrid matcher — BM25 + embedding routing across distinct agent domains."
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "pydantic>=2.0"]

[project.entry-points."agentforge.plugins"]
matcher-test = "agentforge_matcher_test"

[tool.hatch.build.targets.wheel]
packages = ["agentforge_matcher_test"]

[tool.hatch.build.targets.wheel.force-include]
"agentforge_matcher_test/plugin.json" = "agentforge_matcher_test/plugin.json"
"agentforge_matcher_test/agents/fruits_agent/AGENT.md" = "agentforge_matcher_test/agents/fruits_agent/AGENT.md"
"agentforge_matcher_test/agents/vehicles_agent/AGENT.md" = "agentforge_matcher_test/agents/vehicles_agent/AGENT.md"
"agentforge_matcher_test/agents/weather_agent/AGENT.md" = "agentforge_matcher_test/agents/weather_agent/AGENT.md"

[dependency-groups]
dev = ["pytest>=9.0", "httpx>=0.28"]
